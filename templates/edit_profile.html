{% extends "base.html" %}


{% block title %}
编辑个人资料
{% endblock %}



{% block content %}



<div class="edit-profile-page mt-4">



<div class="card edit-profile-card">



<div class="card-body">



<h2 class="mb-4 text-center">

编辑个人资料

</h2>





<form method="POST"
      action="{{ url_for('update_profile') }}"
      enctype="multipart/form-data">





<div class="form-group">


<label>
姓名
</label>


<input type="text"
       class="form-control"
       name="first_name"
       value="{{ current_user.first_name }}"
       required>


</div>






<div class="form-group">


<label>
姓氏
</label>


<input type="text"
       class="form-control"
       name="last_name"
       value="{{ current_user.last_name }}"
       required>


</div>







<div class="form-group">


<label>
学号
</label>


<input type="text"
       class="form-control"
       name="roll_number"
       value="{{ current_user.roll_number }}"
       required>


</div>








<div class="form-group">


<label>
入学年份
</label>


<select class="form-control"
        name="batch"
        required>



{% for year in range(2020,2031) %}


<option value="{{ year }}"
{% if current_user.batch == year %}selected{% endif %}>


{{ year }}


</option>


{% endfor %}



</select>


</div>









<div class="form-group">


<label>
学历
</label>


<select class="form-control"
        name="course"
        required>


<option value="Btech">
本科
</option>


<option value="Barch">
建筑学本科
</option>


<option value="Mtech">
硕士
</option>


<option value="Msc">
理学硕士
</option>


<option value="PHD">
博士
</option>



</select>



</div>









<div class="form-group">


<label>
专业方向
</label>



<select class="form-control"
        name="branch"
        required>



<option value="CSE">
计算机科学与技术
</option>


<option value="ECE">
电子与通信工程
</option>


<option value="EEE">
电气工程
</option>


<option value="ICE">
仪器与控制工程
</option>


<option value="Chem">
化学工程
</option>


<option value="Civil">
土木工程
</option>


<option value="MECH">
机械工程
</option>


<option value="Prod">
生产工程
</option>


<option value="Other">
其他
</option>



</select>



</div>








<div class="form-group">


<label>
更换头像
</label>



<input type="file"
       class="form-control-file"
       name="profile_pic">





{% if current_user.profile_pic %}


<div class="mt-3 text-center">


<img src="{{ url_for('static',
filename='images/' + current_user.profile_pic) }}"
class="edit-avatar">


</div>


{% endif %}




</div>







<div class="text-center">


<button type="submit"
        class="btn btn-primary">


保存修改


</button>


</div>





</form>



</div>


</div>



</div>



{% endblock %}
