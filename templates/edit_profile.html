{% extends "base.html" %}

{% block title %}编辑个人资料{% endblock %}


{% block content %}

<h2 class="mt-4">编辑个人资料</h2>


<form method="POST"
      action="{{ url_for('update_profile') }}"
      enctype="multipart/form-data">


    <div class="form-group">

        <label for="first_name">名</label>

        <input type="text"
               class="form-control"
               id="first_name"
               name="first_name"
               value="{{ current_user.first_name }}"
               required>

    </div>



    <div class="form-group">

        <label for="last_name">姓</label>

        <input type="text"
               class="form-control"
               id="last_name"
               name="last_name"
               value="{{ current_user.last_name }}"
               required>

    </div>



    <div class="form-group">

        <label for="roll_number">学号</label>

        <input type="text"
               class="form-control"
               id="roll_number"
               name="roll_number"
               value="{{ current_user.roll_number }}"
               required>

    </div>



    <div class="form-group">

        <label for="batch">入学年份</label>

        <select class="form-control"
                id="batch"
                name="batch"
                required>


            {% for year in range(2020, 2031) %}

            <option value="{{ year }}"
                {% if current_user.batch == year %}selected{% endif %}>
                {{ year }}
            </option>

            {% endfor %}


        </select>

    </div>




    <div class="form-group">

        <label for="course">学历</label>


        <select class="form-control"
                id="course"
                name="course"
                required>


            <option value="Btech"
                {% if current_user.course == 'Btech' %}selected{% endif %}>
                本科
            </option>


            <option value="Barch"
                {% if current_user.course == 'Barch' %}selected{% endif %}>
                建筑学本科
            </option>


            <option value="Mtech"
                {% if current_user.course == 'Mtech' %}selected{% endif %}>
                硕士
            </option>


            <option value="Msc"
                {% if current_user.course == 'Msc' %}selected{% endif %}>
                理学硕士
            </option>


            <option value="PHD"
                {% if current_user.course == 'PHD' %}selected{% endif %}>
                博士
            </option>


        </select>

    </div>




    <div class="form-group">

        <label for="branch">专业方向</label>


        <select class="form-control"
                id="branch"
                name="branch"
                required>


            <option value="CSE"
                {% if current_user.branch == 'CSE' %}selected{% endif %}>
                计算机科学与技术
            </option>


            <option value="ECE"
                {% if current_user.branch == 'ECE' %}selected{% endif %}>
                电子与通信工程
            </option>


            <option value="EEE"
                {% if current_user.branch == 'EEE' %}selected{% endif %}>
                电气工程
            </option>


            <option value="ICE"
                {% if current_user.branch == 'ICE' %}selected{% endif %}>
                仪器与控制工程
            </option>


            <option value="Chem"
                {% if current_user.branch == 'Chem' %}selected{% endif %}>
                化学工程
            </option>


            <option value="Civil"
                {% if current_user.branch == 'Civil' %}selected{% endif %}>
                土木工程
            </option>


            <option value="MECH"
                {% if current_user.branch == 'MECH' %}selected{% endif %}>
                机械工程
            </option>


            <option value="Prod"
                {% if current_user.branch == 'Prod' %}selected{% endif %}>
                生产工程
            </option>


            <option value="Other"
                {% if current_user.branch == 'Other' %}selected{% endif %}>
                其他
            </option>


        </select>

    </div>




    <div class="form-group">


        <label for="profile_pic">
            头像
        </label>


        <input type="file"
               class="form-control-file"
               id="profile_pic"
               name="profile_pic">



        {% if current_user.profile_pic %}


        <img src="{{ url_for('static', filename='images/' + current_user.profile_pic) }}"
             alt="头像"
             class="img-fluid mt-2"
             width="150"
             height="150">


        {% endif %}


    </div>




    <button type="submit" class="btn btn-primary">
        保存修改
    </button>


</form>


{% endblock %}
