{% extends "base.html" %}


{% block title %}
重置密码
{% endblock %}




{% block content %}



<div class="auth-page mt-5">



<div class="card auth-card">



<div class="card-body">



<h2 class="text-center mb-4">

设置新密码

</h2>





<form method="POST"

      action="{{ url_for('reset_password') }}"

      onsubmit="return validatePassword()">






<div class="form-group">


<label>

新密码

</label>


<input type="password"

       class="form-control"

       id="new_password"

       name="password"

       placeholder="请输入新密码"

       required>




<small class="text-muted">

密码至少8位，并包含字母和数字

</small>


</div>






<button type="submit"

        class="btn btn-primary btn-block">


确认修改


</button>





</form>




</div>


</div>


</div>







<script>


function validatePassword(){



const password =
document.getElementById("new_password").value;



const passwordPattern =
/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;



if(!passwordPattern.test(password)){


alert("密码至少8位，并包含字母和数字");


return false;


}



return true;


}


</script>




{% endblock %}
