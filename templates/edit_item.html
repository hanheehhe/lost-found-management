{% extends "base.html" %}

{% block title %}编辑失物信息{% endblock %}


{% block content %}

<h2 class="mt-4">编辑失物信息</h2>


<form method="POST" enctype="multipart/form-data">


    <div class="form-group">

        <label>物品名称</label>

        <input type="text"
               class="form-control"
               name="name"
               required>

    </div>



    <div class="form-group">

        <label>物品描述</label>

        <textarea class="form-control"
                  name="description"
                  rows="4"></textarea>

    </div>




    <div class="form-group">

        <label>物品状态</label>


        <select class="form-control" name="status">


            <option value="lost">
                丢失
            </option>


            <option value="found">
                拾获
            </option>


        </select>


    </div>




    <div class="form-group">

        <label>日期</label>

        <input type="date"
               class="form-control"
               name="date"
               required>

    </div>




    <div class="form-group">

        <label>地点</label>

        <input type="text"
               class="form-control"
               name="location">

    </div>




    <div class="form-group">

        <label>更换图片</label>

        <input type="file"
               class="form-control-file"
               name="image">

    </div>




    <button type="submit" class="btn btn-primary">
        保存修改
    </button>


</form>


{% endblock %}
