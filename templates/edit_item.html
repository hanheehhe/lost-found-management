{% extends "base.html" %}

{% block title %}编辑失物信息{% endblock %}


{% block content %}

<h2 class="mt-4">编辑失物信息</h2>


<form method="POST" enctype="multipart/form-data">


    <div class="form-group">
        <label>物品名称</label>
        <input type="text" class="form-control" name="name" value="{{ item.name }}" required>
    </div>


    <div class="form-group">
        <label>物品描述</label>
        <textarea class="form-control" name="description" rows="4">{{ item.description }}</textarea>
    </div>


    <div class="form-group">
        <label>物品分类</label>
        <select class="form-control" name="category_id" required>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == item.category_id %}selected{% endif %}>
                {{ category.name }}
            </option>
            {% endfor %}
        </select>
    </div>


    <div class="form-group">
        <label>物品状态</label>
        <select class="form-control" name="status">
            <option value="lost" {% if item.status == 'lost' %}selected{% endif %}>丢失</option>
            <option value="found" {% if item.status == 'found' %}selected{% endif %}>拾获</option>
        </select>
    </div>


    <div class="form-group">
        <label>日期</label>
        <input type="date" class="form-control" name="date" value="{{ item.date }}" required>
    </div>


    <div class="form-group">
        <label>地点</label>
        <input type="text" class="form-control" name="location" value="{{ item.location or '' }}">
    </div>


    <div class="form-group">
        <label>更换图片</label>
        <input type="file" class="form-control-file" name="image">
    </div>


    <button type="submit" class="btn btn-primary">保存修改</button>


</form>


{% endblock %}
