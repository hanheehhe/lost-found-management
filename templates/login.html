{% extends "base.html" %}


{% block title %}
登录
{% endblock %}



{% block content %}



<div class="auth-page mt-5">



<div class="card auth-card">



<div class="card-body">



<h2 class="text-center mb-4">

用户登录

</h2>





<form method="POST"
      action="{{ url_for('login') }}">





<div class="form-group">


<label>

邮箱地址

</label>


<input type="email"

       class="form-control"

       name="email"

       placeholder="请输入邮箱"

       required>


</div>








<div class="form-group">


<label>

密码

</label>


<input type="password"

       class="form-control"

       name="password"

       placeholder="请输入密码"

       required>


</div>








<div class="form-group form-check">


<input type="checkbox"

       class="form-check-input"

       id="remember_me"

       name="remember_me">


<label class="form-check-label"
       for="remember_me">


记住我


</label>


</div>







<button type="submit"

        class="btn btn-primary btn-block">


登录


</button>





</form>








<div class="text-center mt-3">


<a href="{{ url_for('forgot_password') }}">

忘记密码？

</a>


</div>





</div>


</div>



</div>



{% endblock %}
