{% extends "base.html" %}

{% block title %}忘记密码{% endblock %}


{% block content %}

<h2 class="mt-4">忘记密码</h2>


<p>
    请输入邮箱地址以接收密码重置验证码。
</p>



<form method="POST" action="{{ url_for('forgot_password') }}">


    <div class="form-group">


        <label for="email">
            邮箱地址
        </label>


        <input type="email"
               class="form-control"
               id="email"
               name="email"
               required>


    </div>



    <button type="submit" class="btn btn-primary">

        发送验证码

    </button>


</form>


{% endblock %}
