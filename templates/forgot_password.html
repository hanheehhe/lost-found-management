{% extends "base.html" %}


{% block title %}
忘记密码
{% endblock %}



{% block content %}



<div class="auth-page mt-5">



<div class="card auth-card">



<div class="card-body">



<h2 class="text-center mb-4">

找回密码

</h2>




<p class="text-muted text-center">

请输入注册邮箱，我们将帮助你重置密码

</p>







<form method="POST"
      action="{{ url_for('forgot_password') }}">





<div class="form-group">


<label>

邮箱地址

</label>


<input type="email"

       class="form-control"

       name="email"

       placeholder="请输入注册邮箱"

       required>



</div>








<button type="submit"

        class="btn btn-primary btn-block">


下一步


</button>






</form>





</div>


</div>



</div>




{% endblock %}
