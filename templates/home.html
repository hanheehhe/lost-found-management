{% extends "base.html" %}

{% block title %}首页{% endblock %}

{% block content %}

<h2 class="mt-4">失物招领信息</h2>

<form method="GET" action="{{ url_for('home_page') }}" class="form-inline mb-4">

    <input type="text"
           class="form-control mr-2"
           name="search"
           placeholder="搜索物品名称或描述"
           value="{{ request.args.get('search', '') }}">

    <select class="form-control mr-2" name="category">

        <option value="">全部分类</option>

        {% for category in categories %}

        <option value="{{ category.id }}"
            {% if request.args.get('category') == category.id %}selected{% endif %}>
            {{ category.name }}
        </option>

        {% endfor %}

    </select>


    <button type="submit" class="btn btn-primary">
        筛选
    </button>

</form>


<div class="row">

    {% for item in items %}

    <div class="col-md-4 mb-4">

        <div class="card">

            <img src="{{ url_for('static', filename='images/' + item.image_file) }}"
                 class="card-img-top"
                 alt="{{ item.name }}">


            <div class="card-body">

                <h5 class="card-title">
                    {{ item.name }}
                </h5>


                <p class="card-text">

                    {{ item.description[:100] }}

                    {% if item.description|length > 100 %}
                    ...
                    {% endif %}

                </p>


                <a href="{{ url_for('item_detail', item_id=item.id) }}"
                   class="btn btn-primary">
                    查看详情
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
