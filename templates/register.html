{% extends "base.html" %}


{% block title %}
注册
{% endblock %}



{% block content %}



<div class="auth-page register-page mt-4">



<div class="card auth-card">



<div class="card-body">



<h2 class="text-center mb-4">

用户注册

</h2>





<form method="POST"
      action="{{ url_for('register') }}"
      onsubmit="return validateForm()">






<div class="form-group">


<label>
邮箱地址
</label>


<input type="email"
       class="form-control"
       id="email"
       name="email"
       placeholder="请输入邮箱"
       required>


<small class="text-muted">

请使用学校邮箱

</small>


</div>







<div class="row">



<div class="col-md-6">


<div class="form-group">


<label>
名
</label>


<input type="text"
class="form-control"
name="first_name"
required>


</div>


</div>






<div class="col-md-6">


<div class="form-group">


<label>
姓
</label>


<input type="text"
class="form-control"
name="last_name"
required>


</div>


</div>


</div>








<div class="form-group">


<label>
学号
</label>


<input type="text"
class="form-control"
name="roll_number"
required>


</div>








<div class="form-group">


<label>
入学年份
</label>


<input type="number"
class="form-control"
name="batch"
min="2020"
max="2030"
required>


</div>









<div class="form-group">


<label>
学历
</label>


<select class="form-control"
name="course"
required>


<option value="BTECH">
本科
</option>


<option value="MTECH">
硕士
</option>


<option value="PHD">
博士
</option>


</select>



</div>









<div class="form-group">


<label>
专业方向
</label>


<select class="form-control"
name="branch"
required>


<option value="CSE">
计算机科学与技术
</option>


<option value="ECE">
电子与通信工程
</option>


<option value="EEE">
电气工程
</option>


<option value="ICE">
仪器与控制工程
</option>


<option value="CHEM">
化学工程
</option>


<option value="CIVIL">
土木工程
</option>


<option value="MECH">
机械工程
</option>


<option value="PROD">
生产工程
</option>


<option value="OTHER">
其他
</option>



</select>



</div>








<div class="form-group">


<label>
密码
</label>


<input type="password"
class="form-control"
id="password"
name="password"
placeholder="请输入密码"
required>


<small class="text-muted">

密码至少8位，并包含字母和数字

</small>



</div>








<button type="submit"
class="btn btn-primary btn-block">


注册


</button>






</form>





</div>


</div>



</div>







<script>


function validateForm(){


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;




const emailPattern =
/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.edu$/;



if(!emailPattern.test(email)){


alert("请输入有效学校邮箱");


return false;


}




const passwordPattern =
/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;



if(!passwordPattern.test(password)){


alert("密码至少8位，并包含字母和数字");


return false;


}



return true;


}


</script>





{% endblock %}
