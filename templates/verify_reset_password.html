{% extends "base.html" %}



{% block title %}
验证码验证
{% endblock %}




{% block content %}



<div class="auth-page mt-5">



<div class="card auth-card">



<div class="card-body">



<h2 class="text-center mb-4">

验证验证码

</h2>




<p class="text-muted text-center">

请输入发送到邮箱的验证码

</p>







<form method="POST"
      action="{{ url_for('verify_reset_password') }}">





<div class="form-group">


<label>

验证码

</label>



<input type="text"

       class="form-control"

       name="otp"

       placeholder="请输入验证码"

       required>



</div>







<button type="submit"

        class="btn btn-primary btn-block">


验证


</button>





</form>





</div>


</div>



</div>




{% endblock %}
