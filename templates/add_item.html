{% extends "base.html" %}

{% block title %}发布失物{% endblock %}

{% block content %}

<h2 class="mt-4">发布失物信息</h2>


<form method="POST" enctype="multipart/form-data">


    <div class="form-group">

        <label>物品名称</label>

        <input type="text"
               class="form-control"
               name="name"
               placeholder="请输入物品名称"
               required>

    </div>


    <div class="form-group">

        <label>物品描述</label>

        <textarea class="form-control"
                  name="description"
                  rows="4"
                  placeholder="请输入物品详细描述"></textarea>

    </div>



    <div class="form-group">

        <label>物品分类</label>

        <select class="form-control"
                name="category_id"
                required>


            {% for category in categories %}

            <option value="{{ category.id }}">
                {{ category.name }}
            </option>

            {% endfor %}


        </select>

    </div>



    <div class="form-group">

        <label>物品状态</label>


        <select class="form-control"
                name="status">


            <option value="lost">
                丢失
            </option>


            <option value="found">
                拾获
            </option>


        </select>


    </div>




    <div class="form-group">

        <label>丢失/拾获日期</label>

        <input type="date"
               class="form-control"
               name="date"
               required>

    </div>




    <div class="form-group">

        <label>地点</label>

        <input type="text"
               class="form-control"
               name="location"
               placeholder="请输入丢失或拾获地点">

    </div>




    <div class="form-group">

        <label>上传图片</label>

        <input type="file"
               class="form-control-file"
               name="image">

    </div>




    <button type="submit" class="btn btn-primary">
        提交信息
    </button>


</form>


{% endblock %}
