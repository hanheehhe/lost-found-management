<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
</head>

<body>

<h1>管理员后台</h1>


<h2>用户列表</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>邮箱</th>
    <th>姓名</th>
    <th>管理员</th>
</tr>


{% for user in users %}

<tr>
    <td>{{ user.id }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.first_name }}</td>

    <td>
        {% if user.is_admin %}
        是
        {% else %}
        否
        {% endif %}
    </td>

</tr>

{% endfor %}

</table>



<h2>物品列表</h2>

<table border="1">

<tr>
<th>ID</th>
<th>名称</th>
<th>状态</th>
<th>操作</th>
</tr>


{% for item in items %}

<tr>

<td>{{item.id}}</td>

<td>{{item.name}}</td>

<td>{{item.status}}</td>


<td>

<form action="{{ url_for('admin_delete_item', item_id=item.id) }}" method="POST">

<button type="submit">
删除
</button>

</form>

</td>


</tr>

{% endfor %}


</table>


</body>
</html>
